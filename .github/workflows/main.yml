name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# The release step below needs permission to create/update a release and
# upload an asset to it — the default GITHUB_TOKEN can't do that unless we
# grant it explicitly here.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: glucoring-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Artifacts (above) expire and need a GitHub login to download. This
      # instead publishes the same APK to a permanent, always-latest
      # Release — one stable link, no login needed, no expiry. Every
      # successful push to main overwrites it (moving tag), so it always
      # reflects the current main branch.
      - name: Publish debug APK to a rolling "latest-debug" Release
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: "GlucoRing — آخرین بیلد دیباگ (خودکار)"
          body: |
            این ریلیز خودکاره و با هر push موفق به main آپدیت می‌شه.
            نسخه‌ی آزمایشیه — نه امضاشده برای انتشار، نه تایید شده برای مصرف پزشکی.
            Commit: ${{ github.sha }}
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
